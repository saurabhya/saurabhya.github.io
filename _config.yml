# --- Site -----------------------------------------------------------------
title: Saurabh Yadav
tagline: Research Scientist · Microsoft
description: >-
  Personal site of Saurabh Yadav — Research Scientist at Microsoft, working on
  efficient neural networks for time-series modeling. Vim user, ergonomic-keyboard
  enthusiast, early-morning runner.
author: Saurabh Yadav
email: saurabh.yadav919@gmail.com
location: Bangalore, India

url: "https://saurabhya.github.io"
baseurl: ""
lang: en

# --- Social ---------------------------------------------------------------
github_username: saurabhya
linkedin_username: saurabh-yadav-b3460716b
old_website_url: "https://www.saura.bh/old_website/"

# --- Build ----------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /writing/:year/:month/:day/:title/
timezone: Asia/Kolkata

# Treat _pages as a source of pages too
include: ["_pages"]

# --- Pagination (jekyll-paginate) -----------------------------------------
paginate: 6
paginate_path: "/writing/page:num/"

# --- Plugins (GitHub-Pages safe) ------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# --- Front-matter defaults ------------------------------------------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# --- Exclusions -----------------------------------------------------------
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - node_modules
  - .github

# Navigation displayed in the header
nav:
  - { title: "about",        url: "/" }
  - { title: "publications", url: "/publications/" }
  - { title: "cv",           url: "/cv/" }
  - { title: "blog",         url: "/writing/" }
