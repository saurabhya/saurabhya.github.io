# --- Visit map (home page) ------------------------------------------------
# Optional: enable a shared visit map across all visitors using JSONBin.io.
# Without these, the map falls back to per-browser localStorage history.
# Setup (1 minute):
#   1. Create a free account at https://jsonbin.io
#   2. Create a new BIN with initial body:  {"visits": []}
#   3. (Optional but recommended) create an Access Key with read+update
#      permissions scoped to that bin only.
#   4. Paste the bin id and access key below, commit, push.
visits:
  bin_id: "69f7036836566621a81c85e0"
