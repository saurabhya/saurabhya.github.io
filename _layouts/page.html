---
layout: default
---
<article class="page">
  {% if page.title and page.hide_title != true %}
    <header class="page__header">
      <h1 class="page__title">
        <span class="prompt">$</span> {{ page.title }}
      </h1>
      {% if page.subtitle %}<p class="page__subtitle">{{ page.subtitle }}</p>{% endif %}
    </header>
  {% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
