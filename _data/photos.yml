# Photos for the /misc/ page.
#
# Add an entry per image. Drop the file under assets/img/photos/<category>/.
# Fields:
#   src      (required) path under /assets/img/photos/, e.g. sketches/foo.jpg
#   category (required) one of the ids under `categories` below
#   caption  (optional) short blurb shown under the photo
#   place    (optional) location, shown alongside the date
#   date     (optional) free-form, e.g. "Mar 2025" — used for sorting (newest first)
#   alt      (optional) accessibility text; falls back to caption
#
# Categories control the filter pills at the top of /misc/.
# Add or rename categories freely; "all" is added automatically.

categories:
  - id: sketches
    label: sketches
    description: fountain-pen scribbles, mostly bad, slowly less bad.
  - id: places
    label: places
    description: snapshots from runs, trips, and the occasional detour.

photos:
